[project]
name = "ims-backend"
version = "0.1.0"
description = "Mission-Critical Incident Management System — backend (MongoDB-only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "motor>=3.5",
    "pymongo>=4.7",
    "tenacity>=8.5",
    "pybreaker>=1.2",
    "anyio>=4.4",
    "google-generativeai>=0.7",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "numpy>=1.26",
    "orjson>=3.10",
    "websockets>=12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
